# Source control panel: the right Sidebar's Git tab plus the read-only git
# Remote it reads. A deployment that already ships the in-box `git-controller`
# and `ui-git` rows keeps registering nothing twice: those rows are disabled
# here and this package's single row carries both halves.
- insert:
    - id: git-panel
      name: '@deepseek-ai/dsh-git-panel'
- id: git-controller
  disabled: true
- id: ui-git
  disabled: true
